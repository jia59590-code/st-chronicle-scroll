<div class="inline-drawer" id="cs-settings-drawer">
    <div class="inline-drawer-toggle inline-drawer-header" id="cs-drawer-header">
        <b>纪行手记 · 设置与多维词库</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down" id="cs-drawer-icon"></div>
    </div>

    <div class="inline-drawer-content" id="cs-drawer-body" style="display: none; padding: 10px 4px;">
        <!-- 基础开关面板 -->
        <div class="cs-setting-group">
            <div class="cs-toggle-row">
                <span class="cs-toggle-label">自动下发格式指令</span>
                <label class="cs-switch">
                    <input type="checkbox" id="cs-auto-inject-toggle" checked>
                    <span class="cs-slider"></span>
                </label>
            </div>
            <p class="cs-hint-text">发信前自动将手记格式注入到提示词末尾，使任何角色卡无需配置世界书均能输出手记。</p>

            <div class="cs-toggle-row" style="margin-top: 8px;">
                <span class="cs-toggle-label">正文自动洁净 (隐藏标签代码)</span>
                <label class="cs-switch">
                    <input type="checkbox" id="cs-hide-raw-tag" checked>
                    <span class="cs-slider"></span>
                </label>
            </div>
            <p class="cs-hint-text">自动抓取手记数据并把楼层正文里的原始标签隐藏，保持小说沉浸阅读感。</p>
        </div>

        <div class="cs-divider" style="margin: 10px 0;"></div>

        <!-- 词库预设与全局操作 -->
        <div class="cs-setting-group">
            <div class="cs-row-between" style="align-items: center; margin-bottom: 8px;">
                <label class="cs-toggle-label" for="cs-active-preset-select">当前运行词库：</label>
                <div class="cs-btn-group">
                    <button type="button" class="menu_button" id="cs-export-pool-btn" title="导出当前词库 JSON">导出</button>
                    <button type="button" class="menu_button" id="cs-import-pool-btn" title="上传自定义 JSON">导入</button>
                    <input type="file" id="cs-pool-file-input" accept=".json" style="display: none;">
                    <button type="button" class="menu_button" id="cs-reset-pool-btn" title="重置回官方默认预设" style="color: #e74c3c;">重置</button>
                </div>
            </div>
            <select id="cs-active-preset-select" class="text_pole" style="width: 100%; margin-bottom: 10px;">
                <option value="eorzea">艾欧泽亚传奇 (高魔古典奇幻)</option>
                <option value="modern">都市漫游录 (现代甜蜜生活)</option>
                <option value="custom">我的专属自定义词库</option>
            </select>
        </div>

        <!-- 一级大类选择（横向滑动胶囊） -->
        <div class="cs-tabs-header" id="cs-category-tabs">
            <button type="button" class="cs-tab-btn active" data-cat="voyage">未知漫游</button>
            <button type="button" class="cs-tab-btn" data-cat="dungeon">秘境迷宫</button>
            <button type="button" class="cs-tab-btn" data-cat="cook">荒野野炊</button>
            <button type="button" class="cs-tab-btn" data-cat="danger">突发险情</button>
            <button type="button" class="cs-tab-btn" data-cat="beast">奇珍萌物</button>
            <button type="button" class="cs-tab-btn" data-cat="outfit">风尚衣箱</button>
            <button type="button" class="cs-tab-btn" data-cat="camp_topics">营火夜谈</button>
            <button type="button" class="cs-tab-btn" data-cat="souvenirs">纪念行囊</button>
            <button type="button" class="cs-tab-btn" data-cat="photos">旅途拍立得</button>
        </div>

        <!-- 二级小类（槽位 Slot）选择栏 -->
        <div class="cs-slot-bar" id="cs-slots-container">
            <!-- 动态生成当前大类下的所有小类按钮，如：[秘境地界] [遇逢生灵] [当地事态] [旅伴相处] -->
        </div>

        <!-- 当前小类下的词条管理区 -->
        <div class="cs-words-box">
            <div class="cs-words-header">
                <span id="cs-current-slot-title" class="cs-slot-title">词条列表</span>
                <span id="cs-slot-count" class="cs-badge">0 个</span>
            </div>

            <!-- 词条气泡标签池（点击 × 即可删除单个词） -->
            <div class="cs-pills-container" id="cs-pills-container">
                <!-- 动态渲染词条胶囊 -->
            </div>

            <!-- 快速添加单个词条栏 -->
            <div class="cs-inline-add-bar">
                <input type="text" id="cs-new-word-input" class="text_pole" placeholder="输入新词条..." style="flex: 1;">
                <button type="button" class="menu_button primary" id="cs-add-word-btn">+ 添加</button>
            </div>
        </div>
    </div>
</div>
